<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>六合彩中獎檢查系統</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft JhengHei', 'PingFang TC', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .summary {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .summary h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.5em;
        }

        .summary-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .stat-item {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-item .label {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 5px;
        }

        .stat-item .value {
            font-size: 2em;
            font-weight: bold;
        }

        .results-container {
            display: grid;
            gap: 20px;
        }

        .result-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .result-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .draw-info {
            flex: 1;
        }

        .draw-number {
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .draw-date {
            color: #666;
            font-size: 0.95em;
        }

        .prize-badge {
            padding: 10px 25px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 1.2em;
            text-align: center;
            min-width: 120px;
        }

        .prize-1 { background: linear-gradient(135deg, #FFD700, #FFA500); color: #fff; box-shadow: 0 4px 15px rgba(255,215,0,0.4); }
        .prize-2 { background: linear-gradient(135deg, #C0C0C0, #A8A8A8); color: #fff; box-shadow: 0 4px 15px rgba(192,192,192,0.4); }
        .prize-3 { background: linear-gradient(135deg, #CD7F32, #B8860B); color: #fff; box-shadow: 0 4px 15px rgba(205,127,50,0.4); }
        .prize-4 { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; box-shadow: 0 4px 15px rgba(102,126,234,0.4); }
        .prize-5 { background: linear-gradient(135deg, #f093fb, #f5576c); color: #fff; box-shadow: 0 4px 15px rgba(240,147,251,0.4); }
        .prize-6 { background: linear-gradient(135deg, #4facfe, #00f2fe); color: #fff; box-shadow: 0 4px 15px rgba(79,172,254,0.4); }
        .prize-7 { background: linear-gradient(135deg, #43e97b, #38f9d7); color: #fff; box-shadow: 0 4px 15px rgba(67,233,123,0.4); }

        .numbers-section {
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .numbers-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .number-ball {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.1em;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
        }

        .number-ball.matched {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            animation: pulse 1.5s ease-in-out infinite;
            box-shadow: 0 0 20px rgba(245,87,108,0.6);
        }

        .number-ball.extra {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
        }

        .number-ball.extra.matched {
            background: linear-gradient(135deg, #FF6B6B 0%, #FF4757 100%);
            animation: pulse 1.5s ease-in-out infinite;
            box-shadow: 0 0 20px rgba(255,71,87,0.6);
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }

        .match-info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .match-detail {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .match-detail:last-child {
            margin-bottom: 0;
        }

        .match-label {
            color: #666;
            font-size: 0.95em;
        }

        .match-value {
            font-weight: bold;
            color: #333;
            font-size: 1.05em;
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        .no-results h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.8em;
        }

        .no-results p {
            color: #666;
            font-size: 1.1em;
        }

        .plus-sign {
            font-size: 1.2em;
            color: #999;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .result-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .prize-badge {
                width: 100%;
            }

            .number-ball {
                width: 40px;
                height: 40px;
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <p><a href="index.html">返回數據工作台</a> · 此頁為預設號碼示範，使用共用開獎資料</p><h1>🎰 六合彩中獎檢查系統</h1>
        <div class="summary" id="summary"></div>
        <div class="results-container" id="results"></div>
    </div>

    <script src="assets/draws.js?v=20261118-draw-26-122"></script><script src="assets/core.js?v=20261117-prospective"></script>
<script>
        const buyData = [
            [7,9,10,19,23,25],
            [12,21,25,28,30,35],
            [11, 17, 27, 34, 40, 45],
            [11, 13, 24, 26, 34, 35],
            [5, 12, 13, 22, 32, 48],
            [2, 16, 26, 30, 34, 49],
        ];
        // 嵌入真實六合彩數據
        

        // 中獎檢查核心函數
        function checkWinning(buyNumbers, drawNumbers, extraNumber) {
            const matchedNumbers = buyNumbers.filter(num => drawNumbers.includes(num));
            const matchedCount = matchedNumbers.length;
            const hasExtra = buyNumbers.includes(extraNumber);

            const tier = Engine.prize(matchedCount, hasExtra);
            const prize = tier < 0 ? null : tier + 1;
            const prizeName = ['頭獎','二獎','三獎','四獎','五獎','六獎','七獎'][tier] || '';

            return {
                matchedCount,
                hasExtra,
                matchedNumbers,
                prize,
                prizeName
            };
        }

        // 檢查所有投注號碼
        function checkAllBets() {
            const results = [];

            buyData.forEach((bet, betIndex) => {
                lotteryData.forEach(draw => {
                    const result = checkWinning(bet, draw.numbers, draw.extra_number);

                    // 只保留中3個號碼以上的結果
                    if (result.matchedCount >= 3) {
                        results.push({
                            betIndex: betIndex + 1,
                            betNumbers: bet,
                            drawNumber: draw.draw_number,
                            drawDate: draw.draw_date,
                            drawNumbers: draw.numbers,
                            extraNumber: draw.extra_number,
                            ...result
                        });
                    }
                });
            });

            // 按獎項排序（頭獎在前）
            results.sort((a, b) => {
                if (a.prize && b.prize) return a.prize - b.prize;
                if (a.prize) return -1;
                if (b.prize) return 1;
                return b.matchedCount - a.matchedCount;
            });

            return results;
        }

        // 生成統計摘要
        function generateSummary(results) {
            const stats = {
                total: results.length,
                byPrize: {}
            };

            results.forEach(result => {
                if (result.prize) {
                    if (!stats.byPrize[result.prize]) {
                        stats.byPrize[result.prize] = 0;
                    }
                    stats.byPrize[result.prize]++;
                }
            });

            return stats;
        }

        // 渲染號碼球
        function renderNumberBall(number, isMatched, isExtra = false) {
            const classes = ['number-ball'];
            if (isExtra) classes.push('extra');
            if (isMatched) classes.push('matched');

            return `<div class="${classes.join(' ')}">${number}</div>`;
        }

        // 渲染統計摘要
        function renderSummary(stats) {
            const prizeNames = {
                1: '頭獎',
                2: '二獎',
                3: '三獎',
                4: '四獎',
                5: '五獎',
                6: '六獎',
                7: '七獎'
            };

            let html = '<h2>📊 中獎統計</h2>';
            html += '<div class="summary-stats">';
            html += `
                <div class="stat-item">
                    <div class="label">總中獎次數</div>
                    <div class="value">${stats.total}</div>
                </div>
            `;

            for (let i = 1; i <= 7; i++) {
                const count = stats.byPrize[i] || 0;
                if (count > 0) {
                    html += `
                        <div class="stat-item">
                            <div class="label">${prizeNames[i]}</div>
                            <div class="value">${count}</div>
                        </div>
                    `;
                }
            }

            html += '</div>';
            return html;
        }

        // 渲染單個結果卡片
        function renderResultCard(result) {
            let html = '<div class="result-card">';

            // 標題區域
            html += '<div class="result-header">';
            html += '<div class="draw-info">';
            html += `<div class="draw-number">第 ${result.drawNumber} 期</div>`;
            html += `<div class="draw-date">${result.drawDate}</div>`;
            html += '</div>';

            if (result.prize) {
                html += `<div class="prize-badge prize-${result.prize}">${result.prizeName}</div>`;
            }

            html += '</div>';

            // 開獎號碼
            html += '<div class="numbers-section">';
            html += '<div class="section-title">開獎號碼</div>';
            html += '<div class="numbers-row">';

            result.drawNumbers.forEach(num => {
                const isMatched = result.matchedNumbers.includes(num);
                html += renderNumberBall(num, isMatched);
            });

            html += '<span class="plus-sign">+</span>';
            html += renderNumberBall(result.extraNumber, result.hasExtra, true);

            html += '</div>';
            html += '</div>';

            // 投注號碼
            html += '<div class="numbers-section">';
            html += `<div class="section-title">投注號碼 (第 ${result.betIndex} 注)</div>`;
            html += '<div class="numbers-row">';

            result.betNumbers.forEach(num => {
                const isMatched = result.matchedNumbers.includes(num);
                const isExtra = num === result.extraNumber;
                html += renderNumberBall(num, isMatched, isExtra);
            });

            html += '</div>';
            html += '</div>';

            // 中獎詳情
            html += '<div class="match-info">';
            html += '<div class="match-detail">';
            html += '<span class="match-label">中正選號碼</span>';
            html += `<span class="match-value">${result.matchedCount} 個</span>`;
            html += '</div>';

            html += '<div class="match-detail">';
            html += '<span class="match-label">中特別號</span>';
            html += `<span class="match-value">${result.hasExtra ? '是 ✓' : '否 ✗'}</span>`;
            html += '</div>';

            if (result.matchedNumbers.length > 0) {
                html += '<div class="match-detail">';
                html += '<span class="match-label">中獎號碼</span>';
                html += `<span class="match-value">${result.matchedNumbers.sort((a, b) => a - b).join(', ')}</span>`;
                html += '</div>';
            }

            html += '</div>';

            html += '</div>';
            return html;
        }

        // 主渲染函數
        function render() {
            const results = checkAllBets();
            const stats = generateSummary(results);

            // 渲染統計摘要
            const summaryEl = document.getElementById('summary');
            summaryEl.innerHTML = renderSummary(stats);

            // 渲染結果列表
            const resultsEl = document.getElementById('results');

            if (results.length === 0) {
                resultsEl.innerHTML = `
                    <div class="no-results">
                        <h2>😔 沒有中獎記錄</h2>
                        <p>您的投注號碼在歷史開獎中沒有中3個號碼以上的記錄</p>
                    </div>
                `;
            } else {
                resultsEl.innerHTML = results.map(result => renderResultCard(result)).join('');
            }
        }

        // 頁面載入時執行
        document.addEventListener('DOMContentLoaded', render);

    </script>
</body>
</html>
